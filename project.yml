name: Carbs
options:
  bundleIdPrefix: com.sbalint
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: W8BGT53U8Q
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Carbs:
    type: application
    platform: iOS
    sources:
      - path: Carbs
        excludes: ["Config/*.xcconfig"]
    configFiles:
      Debug: Carbs/Config/Secrets.xcconfig
      Release: Carbs/Config/Secrets.xcconfig
    info:
      path: Carbs/Info.plist
      properties:
        CFBundleDisplayName: Carbs
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Carbs uses the camera to scan food barcodes.
        NSHealthShareUsageDescription: Carbs reads your step count to fine-tune weekly calorie suggestions.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        FatSecretProxyURL: $(FATSECRET_PROXY_URL)
        LoopAppGroup: $(LOOP_APP_GROUP)
        LoopURLScheme: $(LOOP_URL_SCHEME)
        LSApplicationQueriesSchemes: [$(LOOP_URL_SCHEME)]
        CarbsProxyToken: $(CARBS_PROXY_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbalint.carbs
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Carbs/Carbs.entitlements
        # Loop's own App Group (LoopWorkspace default: group.com.<team>.loopkit.LoopGroup).
        # Change these if your Loop build overrides MAIN_APP_BUNDLE_IDENTIFIER or URL_SCHEME_NAME.
        LOOP_APP_GROUP: group.com.$(DEVELOPMENT_TEAM).loopkit.LoopGroup
        LOOP_URL_SCHEME: loop
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CarbsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CarbsTests]
    dependencies:
      - target: Carbs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbalint.carbs.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Carbs:
    build:
      targets:
        Carbs: all
        CarbsTests: [test]
    test:
      targets: [CarbsTests]
